name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: facility_reporting_test
          POSTGRES_USER: facility
          POSTGRES_PASSWORD: local_only_change_me
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U facility -d facility_reporting_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: facility_reporting_test
      DB_USERNAME: facility
      DB_PASSWORD: local_only_change_me
      APP_ENV: testing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql
          tools: composer:v2
          coverage: none
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: apps/api
          require-lock-file: true
          composer-options: --no-interaction --prefer-dist
      - name: Validate lockfile
        run: composer validate --strict --no-check-publish
      - name: Prepare app and schema
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - name: Quality checks
        run: composer check
      - name: Verify committed API contract
        run: composer docs:export && git diff --exit-code -- api.json
      - name: Dependency audit
        run: composer audit --locked
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: test -f pnpm-lock.yaml && test -f apps/api/composer.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/web types:generate && git diff --exit-code -- apps/web/src/lib/api/schema.d.ts
      - run: pnpm --dir apps/web check
